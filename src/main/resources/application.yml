server:
  port: 8084
  forward-headers-strategy: framework

spring:
  application:
    name: funding-service
  profiles:
    active: dev

  redis:
    data:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html